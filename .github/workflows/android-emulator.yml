name: android-emulator

# Starts two read-only emulators from one AVD on a Linux runner with KVM, the
# way two worktrees would, and stops them (#254). The android-native e2e pair
# will replace this (#251).
on:
  pull_request:
    paths:
      - "src/core/emulator.ts"
      - "test/emulator.test.ts"
      - ".github/workflows/android-emulator.yml"

permissions:
  contents: read

jobs:
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the system image and make an AVD
        shell: bash
        run: |
          bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$bin/sdkmanager" --licenses > /dev/null
          "$bin/sdkmanager" "emulator" "platform-tools" "$IMAGE" > /dev/null
          echo no | "$bin/avdmanager" create avd -n emd-test -k "$IMAGE"
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Start, boot and stop two emulators
        env:
          EMD_TEST_AVD: emd-test
        run: |
          npm ci
          npx vitest run test/emulator.test.ts
