name: e2e

# A real launch of fixtures/expo on an iOS simulator (decision 0007).
# The paths are checked in the first step, not in a `paths:` filter, so the
# `e2e` label can force a run on any PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # A release PR changes only versions and the changelog; its commits were
    # tested in their own PRs and the nightly, so no macOS runner starts for it.
    if: github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26
    timeout-minutes: 60
    # The tool versions e2e tests (decision 0008, condition 4).
    # To bump AXe, change the version and the archive's SHA-256 together.
    env:
      AXE_VERSION: 1.8.0
      AXE_SHA256: 7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834
      MAESTRO_VERSION: 2.12.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to run
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          paths='^(src/core/(simulator|launch|isolate|jobs|process|logs|tool)\.ts|src/core/device/|src/adapters/|test/e2e/|fixtures/|package(-lock)?\.json|\.github/workflows/e2e\.yml)'
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LABELLED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The e2e label is on."
          elif git diff --name-only HEAD^1 HEAD | grep -E "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changed file touches the e2e paths and the e2e label is off."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm ci
          npm ci --prefix fixtures/expo
          curl -fsSL -o "$RUNNER_TEMP/axe.tar.gz" \
            "https://github.com/cameroncooke/AXe/releases/download/v$AXE_VERSION/AXe-macOS-v$AXE_VERSION-universal.tar.gz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          # The script installs MAESTRO_VERSION from the job env.
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Print versions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          java -version
          node --version
          # Fail when an installed tool is not the pinned version.
          "$HOME/.maestro/bin/maestro" --version | tee /dev/stderr | grep -Fx "$MAESTRO_VERSION" > /dev/null
          axe --version | tee /dev/stderr | grep -Fx "$AXE_VERSION" > /dev/null

      - name: Run e2e
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EMD_STATE_DIR: ${{ runner.temp }}/emd-state
        run: npm run test:e2e 2>&1 | tee e2e-output.txt

      - name: Upload output and run logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            e2e-output.txt
            ${{ runner.temp }}/emd-state/runs
          if-no-files-found: warn
