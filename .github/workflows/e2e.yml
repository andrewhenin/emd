name: e2e

# A real launch of fixtures/expo on an iOS simulator (decision 0007).
# The paths are checked in the first step, not in a `paths:` filter, so the
# `e2e` label can force a run on any PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    # Release Please's own PR changes only versions and the changelog; its
    # commits were tested in their own PRs and the nightly, so no macOS runner
    # starts for it. Both the bot and the branch must match, so a person can't
    # skip e2e by naming a branch. The e2e label still forces a run.
    if: >-
      github.event.pull_request.draft != true &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.head_ref, 'release-please--') &&
        !contains(github.event.pull_request.labels.*.name, 'e2e'))
    # PRs run on Xcode 26 only; the nightly and manual runs also run on Xcode 27
    # (#124). Xcode 27 is advisory until it has passed: its failure does not
    # fail the run.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-26"]' || '["macos-26","xcode-27"]') }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'xcode-27' }}
    timeout-minutes: 60
    # The tool versions e2e tests (decision 0008, condition 4). AXe's pin is
    # in src/core/device/axe.ts: setup installs it below.
    env:
      MAESTRO_VERSION: 2.12.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether to run
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          paths='^(src/core/(simulator|launch|isolate|jobs|process|logs|tool|setup|doctor)\.ts|src/core/device/|src/adapters/|test/e2e/|fixtures/|package(-lock)?\.json|\.github/workflows/e2e\.yml)'
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LABELLED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The e2e label is on."
          elif git diff --name-only HEAD^1 HEAD | grep -E "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changed file touches the e2e paths and the e2e label is off."
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm ci
          npm ci --prefix fixtures/expo
          # The script installs MAESTRO_VERSION from the job env.
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # setup for real, in a throwaway home: its pinned installers (add-mcp,
      # skills), so a breaking change in them shows here (decision 0008), and
      # its pinned AXe, which the rest of the job uses. setup checks AXe's
      # SHA-256 and version; `jq -e` fails when setup installed no AXe.
      - name: Run setup with the real installers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm run build
          home="$RUNNER_TEMP/setup-home"
          mkdir -p "$home/.claude" "$home/.codex" "$home/.cursor"
          echo '{}' > "$home/.claude.json"
          HOME="$home" EMD_STATE_DIR="$home/.emd" node dist/bin.js setup --yes | tee "$RUNNER_TEMP/setup.json"
          grep -q '"verdict":"done"' "$RUNNER_TEMP/setup.json"
          grep -q '"name":"device tool","status":"ok","detail":"axe"' "$RUNNER_TEMP/setup.json"
          jq -er .axe.dir "$RUNNER_TEMP/setup.json" >> "$GITHUB_PATH"

      - name: Print versions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          xcodebuild -version
          echo "iOS simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes
          java -version
          node --version
          axe --version
          # Fail when Maestro is not the pinned version.
          "$HOME/.maestro/bin/maestro" --version | tee /dev/stderr | grep -Fx "$MAESTRO_VERSION" > /dev/null

      - name: Run doctor
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node dist/bin.js doctor | tee "$RUNNER_TEMP/doctor.json"
          grep -q '"verdict":"ready"' "$RUNNER_TEMP/doctor.json"

      - name: Run e2e
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EMD_STATE_DIR: ${{ runner.temp }}/emd-state
        run: npm run test:e2e 2>&1 | tee e2e-output.txt

      - name: Upload output and run logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}-${{ matrix.runner }}
          path: |
            e2e-output.txt
            ${{ runner.temp }}/emd-state/runs
            ~/.maestro/tests
          if-no-files-found: warn
