name: exp-tap-tools

# Temporary: runs experiments/tap-tools.ts once on a macOS runner. Not merged.
on:
  push:
    branches: [exp/tap-tools]

permissions:
  contents: read

jobs:
  tap-tools:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      AXE_VERSION: 1.8.0
      AXE_SHA256: 7b76340b72e90d0f211bc7c4636f15009076eff07acef2f2b632b175debd8834
      MAESTRO_VERSION: 2.12.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Download AXe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$AXE_VERSION" --repo cameroncooke/AXe \
            --pattern "AXe-macOS-v$AXE_VERSION-universal.tar.gz" \
            --output "$RUNNER_TEMP/axe.tar.gz" --clobber
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          npm ci
          npm ci --prefix fixtures/expo
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Launch the sandbox
        id: launch
        env:
          EMD_STATE_DIR: ${{ runner.temp }}/emd-state
        run: |
          npm run build
          xcodebuild -version
          node dist/bin.js launch fixtures/expo | tee launch.json
          echo "udid=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("launch.json","utf8")).device.id)')" >> "$GITHUB_OUTPUT"
      - name: Run the experiment
        env:
          OUT_DIR: ${{ runner.temp }}/tap-tools-out
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: node --experimental-strip-types experiments/tap-tools.ts "${{ steps.launch.outputs.udid }}" 10 2>&1 | tee "$RUNNER_TEMP/tap-tools-out.log"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tap-tools-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tap-tools-out
            ${{ runner.temp }}/tap-tools-out.log
            launch.json
          if-no-files-found: warn
