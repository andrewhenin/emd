name: android-e2e

# On a Linux runner with KVM: two read-only emulators from one AVD, the way two
# worktrees run them (#254), then real launches and checks of
# fixtures/android-native and fixtures/expo through the MCP server (decision
# 0007).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "fixtures/android-native/**"
      - "fixtures/expo/**"
      - "test/emulator.test.ts"
      - "test/e2e/android.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-e2e.yml"

permissions:
  contents: read

jobs:
  android:
    # Release Please's own PR changes only versions and the changelog; its
    # commits were tested in their own PRs, so no emulator starts for it. The
    # same skip as e2e.yml: both the bot and the branch must match, and the e2e
    # label still forces a run.
    if: >-
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.head_ref, 'release-please--') &&
        !contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IMAGE: system-images;android-35;google_apis;x86_64
      # avdmanager and the emulator can look for AVDs in different folders;
      # one folder for both.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the system image and make an AVD
        shell: bash
        run: |
          bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          # yes ends on SIGPIPE when sdkmanager exits, which pipefail counts.
          yes | "$bin/sdkmanager" --licenses > /dev/null || true
          "$bin/sdkmanager" "emulator" "platform-tools" "$IMAGE" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$bin/avdmanager" create avd -n emd-test -k "$IMAGE" -p "$ANDROID_AVD_HOME/emd-test.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /dev/stderr | grep -qx emd-test

      - name: Emulators, then a real launch
        env:
          EMD_TEST_AVD: emd-test
        run: |
          npm ci
          npm ci --prefix fixtures/expo
          npm run build
          npx vitest run test/emulator.test.ts test/e2e/android.test.ts --no-file-parallelism
