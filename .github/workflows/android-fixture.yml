name: android-fixture

# Builds fixtures/android-native on Linux, so a fixture that doesn't build never
# merges (decision 0007). The android-native e2e pair will replace this (#251).
on:
  pull_request:
    paths:
      - "fixtures/android-native/**"
      - ".github/workflows/android-fixture.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build the debug APK
        working-directory: fixtures/android-native
        run: ./gradlew --no-daemon assembleDebug

      - name: Print the APK's app ID
        shell: bash
        run: |
          apk=fixtures/android-native/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/aapt2" dump badging "$apk" | head -1
